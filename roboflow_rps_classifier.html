<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가위바위보 실시간 인식 (오프라인 AI)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <header class="mb-4 text-center">
        <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
            가위바위보 실시간 인식 (오프라인 AI)
        </h1>
        <p class="text-slate-400 text-sm mt-1">웹캠을 향해 손을 보여주세요. API 없이 브라우저에서 바로 판별합니다.</p>
    </header>

    <main class="relative w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
        
        <!-- Webcam Video Stream & Canvas -->
        <div class="relative w-full aspect-video bg-black flex items-center justify-center">
            <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover -scale-x-100"></video>
            <canvas id="canvas" class="absolute inset-0 w-full h-full pointer-events-none -scale-x-100"></canvas>
            
            <!-- Result Overlay (Top Right Corner) -->
            <div id="prediction-badge" class="absolute top-4 right-4 bg-slate-900/90 backdrop-blur-md border border-slate-600 px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 transition-all duration-300">
                <span class="text-2xl" id="prediction-emoji">✊</span>
                <div>
                    <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">인식된 손 모양</p>
                    <span id="prediction-text" class="text-lg font-extrabold text-cyan-400">대기 중...</span>
                </div>
            </div>

            <!-- Status Dot (Bottom Left) -->
            <div class="absolute bottom-4 left-4 bg-slate-900/80 backdrop-blur-sm px-3 py-1.5 rounded-lg border border-slate-700 flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse" id="status-dot"></span>
                <span id="status-label" class="text-xs font-medium text-slate-300">모델 로딩 중...</span>
            </div>

            <!-- Loading overlay before camera starts -->
            <div id="loading-overlay" class="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center space-y-3 z-10 p-6 text-center">
                <svg id="loading-spinner" class="animate-spin h-10 w-10 text-cyan-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <div id="loading-message-container">
                    <p class="text-slate-300 font-medium text-sm">MediaPipe AI 모델 및 웹캠 로딩 중...</p>
                </div>
            </div>
        </div>

        <!-- Controls Section -->
        <div class="p-4 bg-slate-800/80 border-t border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-xs text-slate-400 text-center sm:text-left flex items-center space-x-2">
                <span>💡</span>
                <span>주먹(Rock), 가위(Scissors), 보(Paper)를 자유롭게 보여주세요</span>
            </div>
            <div class="flex items-center space-x-2 w-full sm:w-auto">
                <button id="toggle-btn" class="w-full sm:w-auto px-5 py-2.5 bg-rose-600 hover:bg-rose-500 text-white text-sm font-semibold rounded-xl shadow-lg transition-colors duration-200">
                    인식 정지
                </button>
                <button id="reconnect-btn" class="w-full sm:w-auto px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-semibold rounded-xl shadow-lg transition-colors duration-200">
                    재연결
                </button>
            </div>
        </div>
    </main>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const predictionText = document.getElementById('prediction-text');
        const predictionEmoji = document.getElementById('prediction-emoji');
        const statusDot = document.getElementById('status-dot');
        const statusLabel = document.getElementById('status-label');
        const loadingOverlay = document.getElementById('loading-overlay');
        const toggleBtn = document.getElementById('toggle-btn');
        const reconnectBtn = document.getElementById('reconnect-btn');

        let streamActive = true;
        let hands = null;
        let camera = null;

        // 두 점 사이의 거리 계산 함수
        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) + Math.pow(p1.z - p2.z, 2));
        }

        // 손가락 랜드마크로부터 가위/바위/보 판단
        function classifyGesture(landmarks) {
            // 손목 (0), 엄지 (1~4), 검지 (5~8), 중지 (9~12), 약지 (13~16), 새끼 (17~20)
            const wrist = landmarks[0];

            // 각 손가락 끝과 손목 사이의 거리 계산
            // 손가락이 펴져있으면 손목과의 거리가 멀고, 쥐고 있으면 거리가 가까움
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];

            const indexMcp = landmarks[5];
            const middleMcp = landmarks[9];
            const ringMcp = landmarks[13];
            const pinkyMcp = landmarks[17];

            // 손가락 마디(MCP)와 손목 사이의 거리 기준으로 손가락 펴짐 여부 판단
            const isIndexOpen = getDistance(indexTip, wrist) > getDistance(indexMcp, wrist) * 1.25;
            const isMiddleOpen = getDistance(middleTip, wrist) > getDistance(middleMcp, wrist) * 1.25;
            const isRingOpen = getDistance(ringTip, wrist) > getDistance(ringMcp, wrist) * 1.25;
            const isPinkyOpen = getDistance(pinkyTip, wrist) > getDistance(pinkyMcp, wrist) * 1.25;

            // 판정 로직
            const openCount = [isIndexOpen, isMiddleOpen, isRingOpen, isPinkyOpen].filter(Boolean).length;

            if (openCount === 0 || openCount === 1) {
                return { name: '바위 (Rock)', emoji: '✊', class: 'rock' };
            } else if (openCount >= 3) {
                return { name: '보 (Paper)', emoji: '✋', class: 'paper' };
            } else if (isIndexOpen && isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                return { name: '가위 (Scissors)', emoji: '✌️', class: 'scissors' };
            } else {
                // 모호한 경우 대략적인 갯수로 판단
                if (openCount === 2) {
                    return { name: '가위 (Scissors)', emoji: '✌️', class: 'scissors' };
                } else if (openCount >= 3) {
                    return { name: '보 (Paper)', emoji: '✋', class: 'paper' };
                } else {
                    return { name: '바위 (Rock)', emoji: '✊', class: 'rock' };
                }
            }
        }

        // MediaPipe 결과 처리 콜백
        function onResults(results) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    // 손 스켈레톤 라인 그리기 (drawing_utils.js 로드 완료 후 정상 작동)
                    drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#06b6d4', lineWidth: 3});
                    drawLandmarks(ctx, landmarks, {color: '#f43f5e', lineWidth: 1, radius: 4});

                    // 가위바위보 판정
                    const result = classifyGesture(landmarks);
                    predictionText.textContent = result.name;
                    predictionEmoji.textContent = result.emoji;
                    statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]";
                }
            } else {
                predictionText.textContent = "손 모양 미감지";
                predictionEmoji.textContent = "❓";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
            }
            ctx.restore();
        }

        // 초기화 및 실행
        async function initAI() {
            try {
                hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.6
                });

                hands.onResults(onResults);

                camera = new Camera(video, {
                    onFrame: async () => {
                        if (streamActive) {
                            await hands.send({ image: video });
                        }
                    },
                    width: 640,
                    height: 480
                });

                await camera.start();
                loadingOverlay.style.display = 'none';
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                statusLabel.textContent = "오프라인 AI 인식 중";
            } catch (err) {
                console.error("웹캠 또는 AI 초기화 오류:", err);
                loadingOverlay.innerHTML = `
                    <div class="text-red-400 text-center space-y-2">
                        <p class="font-bold text-base">카메라를 실행할 수 없습니다.</p>
                        <p class="text-xs text-slate-300">브라우저 카메라 권한을 확인해주세요.</p>
                        <button onclick="location.reload()" class="mt-2 px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded-lg shadow">
                            다시 시도
                        </button>
                    </div>
                `;
            }
        }

        // 버튼 이벤트
        toggleBtn.addEventListener('click', () => {
            if (streamActive) {
                streamActive = false;
                if (camera) camera.stop();
                toggleBtn.textContent = "인식 시작";
                toggleBtn.className = "w-full sm:w-auto px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-xl shadow-lg transition-colors duration-200";
                predictionText.textContent = "정지됨";
                predictionEmoji.textContent = "⏸️";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-slate-500";
                statusLabel.textContent = "인식 중지됨";
            } else {
                streamActive = true;
                if (camera) camera.start();
                toggleBtn.textContent = "인식 정지";
                toggleBtn.className = "w-full sm:w-auto px-5 py-2.5 bg-rose-600 hover:bg-rose-500 text-white text-sm font-semibold rounded-xl shadow-lg transition-colors duration-200";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                statusLabel.textContent = "오프라인 AI 인식 중";
            }
        });

        reconnectBtn.addEventListener('click', () => {
            location.reload();
        });

        // 페이지 로드 시 실행
        window.addEventListener('load', initAI);
    </script>
</body>
</html>
